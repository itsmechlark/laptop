name: Tests CI
on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:
jobs:
  # The agent payload needs neither macOS nor Homebrew, so it gets its own fast
  # job: seconds on a PR instead of waiting behind a full `sh mac` run. The
  # spell check rides along for the same reason — it reads files, nothing else.
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/check-payload --since needs history to diff against the base branch.
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/check-payload scripts/run-trigger-evals
      - name: Byte-compile the trigger-eval engine
        # The one Python file in the tooling; catch syntax errors in CI even
        # though the eval itself needs a live model and can't run here.
        run: python3 -m py_compile scripts/lib/run_eval_local.py

      - name: Check payload (pull request)
        if: github.event_name == 'pull_request'
        # Passed through env rather than interpolated into the command: a ref
        # name is external input, and ${{ }} substitution happens before the
        # shell ever sees quoting.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh scripts/check-payload --since "origin/$BASE_REF"

      - name: Check payload
        if: github.event_name != 'pull_request'
        run: sh scripts/check-payload

      - name: Install cspell
        # Pinned to the major that `mac` installs from Homebrew, so CI and a
        # provisioned laptop resolve the same bundled dictionaries.
        run: npm install --global cspell@10
      - name: Spell check
        # --dot or the per-client config directories go unchecked.
        run: cspell lint --no-progress --dot "**/*"

  tests:
    strategy:
      matrix:
        version: ["macos-26", "macos-15"]
      fail-fast: false
    runs-on: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Update Homebrew
        run: brew update
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        run: shellcheck mac -e SC2039
      - name: Unlink preinstalled node
        run: |
          if brew list node >/dev/null 2>&1; then
            brew unlink node
          fi
      - name: Run mac
        run: sh mac
